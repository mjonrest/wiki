# Can players enter an instance again, or only once? Checked by hand against the server scripts.
#
#   entry: once     a story instance: the entrance only opens while one story step is active, and clearing the
#                   instance moves the story on, so it closes for good. You can retry until you clear it.
#   entry: repeat   it can be run again.
#   cooldown: [quest ids]   the wait quests to show, when the script check the wiki reads (checkquest(N, PLAYTIME) at
#                   the entrance) finds the wrong one or none. [] means it has no cooldown.
#   note:           one extra sentence shown on the instance page.
#
# Instances not listed here are repeatable when their entrance checks a wait quest. Every instance the server loads
# should be covered by one or the other; the build prints a warning for any that is not.

# Story instances (no cooldown, entrance gated by the story)
