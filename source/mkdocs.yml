site_name: Miracle RO Wiki
site_description: Player guide for the Miracle Ragnarok Online server
site_url: https://miracle-mmo.com/wiki/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/sword-cross

extra_css:
  - assets/miracle.css

extra_javascript:
  - assets/db.js

hooks:
  - hooks.py

plugins:
  - search
  - macros:
      module_name: main

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Server facts shown on the home page. These come from conf/battle/*.conf in
# the repository; conf/import/ is not committed, so correct them here if the
# live server overrides them.
extra:
  server:
    exp_rate: 1000x
    drop_rate: 1000x (equipment 250x, cards 100x)
    client: 2026-01-07
    episode: Episode 20

