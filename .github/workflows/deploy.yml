# Uploads the built wiki to the web host over FTP, so the live site at miracle-mmo.com/wiki follows main
# without anyone copying files by hand. Only files that changed since the last upload are sent
# (source/tools/deploy_ftp.sh keeps the uploaded commit in .deployed-commit in the wiki folder on the host).
# Runs after "Rebuild wiki" and "Sync images" (their commits don't start workflows on their own), on any other
# push to main, and by hand from the Actions tab.
# Needs the secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD: the same details WinSCP uses to log in.
# Optional repository variables: FTP_DIR (default domains/miracle-mmo.com/public_html/wiki/) and
# FTP_PROTOCOL (ftp or ftps, default ftp).
name: Deploy to web host

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Rebuild wiki, Sync images]
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-wiki
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the FTP details are set
        id: check
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$SERVER" ]; then
            echo "::warning::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to upload the wiki. See source/README.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          ref: main
      # lftp comes from Ubuntu's package servers, which GitHub's runners sometimes can't reach (DNS failures on
      # 2026-11-11 failed two deploys). Keep the downloaded package in the Actions cache and install from it, and
      # retry the download a few times when it isn't cached yet.
      - name: Restore the cached lftp package
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/lftp-deb
          key: lftp-deb-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install lftp
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/lftp-deb
          if command -v lftp >/dev/null; then exit 0; fi
          if ls ~/lftp-deb/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/lftp-deb/*.deb; then
            echo "Installed lftp from the cache"; exit 0
          fi
          rm -f ~/lftp-deb/*.deb
          apt_opts="-q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for try in 1 2 3 4; do
            if sudo apt-get install -y $apt_opts --download-only lftp \
               || { sudo apt-get update $apt_opts && sudo apt-get install -y $apt_opts --download-only lftp; }; then
              cp /var/cache/apt/archives/lftp_*.deb ~/lftp-deb/
              sudo apt-get install -y $apt_opts lftp
              exit 0
            fi
            echo "::warning::Could not download lftp (try $try of 4); waiting before the next try"
            sleep $((try * 30))
          done
          echo "::error::Ubuntu's package servers could not be reached, so lftp could not be installed. Re-run this workflow later."
          exit 1
      - name: Upload
        if: steps.check.outputs.skip != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'domains/miracle-mmo.com/public_html/wiki' }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}
        run: source/tools/deploy_ftp.sh
