# Uploads the built wiki to the web host over FTP, so the live site at miracle-mmo.com/wiki follows main
# without anyone copying files by hand. Only files that changed since the last upload are sent
# (source/tools/deploy_ftp.sh keeps the uploaded commit in .deployed-commit in the wiki folder on the host).
# Runs after "Rebuild wiki" and "Sync images" (their commits don't start workflows on their own), on any other
# push to main, and by hand from the Actions tab.
# Needs the secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD: the same details WinSCP uses to log in.
# Optional repository variables: FTP_DIR (default domains/miracle-mmo.com/public_html/wiki/) and
# FTP_PROTOCOL (ftp or ftps, default ftp).
name: Deploy to web host

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Rebuild wiki, Sync images]
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-wiki
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the FTP details are set
        id: check
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$SERVER" ]; then
            echo "::warning::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to upload the wiki. See source/README.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          ref: main
      - if: steps.check.outputs.skip != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp
      - name: Upload
        if: steps.check.outputs.skip != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'domains/miracle-mmo.com/public_html/wiki' }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}
        run: source/tools/deploy_ftp.sh
