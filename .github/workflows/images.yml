# Saves item icons, monster pictures, skill icons and NPC pictures from Divine Pride into img/, so the wiki serves them itself.
# Runs when the database changes, or by hand from the Actions tab ("Run workflow").
name: Sync images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [db/data/items.json, db/data/mobs.json, db/data/skills.json, db/data/npcs.json]

permissions:
  contents: write

concurrency: sync-images

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 source/tools/fetch_images.py
      - name: Commit new pictures
        run: |
          git add img
          if git diff --cached --quiet; then echo "No new pictures"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save item and monster pictures"
          git pull --rebase origin main
          git push origin HEAD:main
