# Saves item icons, monster pictures and skill icons from Divine Pride, and NPC pictures from ai4rei's NPC list
# (nn.ai4rei.net/dev/npclist), into img/, so the wiki serves them itself.
# Item and skill icons go into the sprite sheets in img/sheets/ (source/tools/pack_icons.py).
# Runs when the database changes, or by hand from the Actions tab ("Run workflow").
name: Sync images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [db/data/items.json, db/data/mobs.json, db/data/skills.json, db/data/npcs.json, db/data/npc_sprites.json, source/tools/fetch_images.py]

permissions:
  contents: write

concurrency: sync-images

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - run: python source/tools/fetch_images.py
      - name: Commit new pictures
        run: |
          git add -A img
          if git diff --cached --quiet; then echo "No new pictures"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save item, monster and NPC pictures"
          git pull --rebase origin main
          git push origin HEAD:main
